name: Build & Release Signed Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_OPTS: "-Xmx3584m"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx3584m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8\""

jobs:
  build-apk:
    name: Build & Publish Masarik-Tourism.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Fixed Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Restoring fixed Release Keystore from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > release.keystore
          elif [ -f "release.keystore.base64" ]; then
            echo "Restoring permanent release.keystore.base64 from repository..."
            tr -d '\n\r ' < release.keystore.base64 | base64 -d > release.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using repository debug.keystore.base64..."
            tr -d '\n\r ' < debug.keystore.base64 | base64 -d > release.keystore
          else
            echo "ERROR: No fixed signing keystore found in Secrets or repository!"
            exit 1
          fi
          cp release.keystore debug.keystore
          ls -lh release.keystore

      - name: Set Official Release Version 1.0.0
        run: |
          echo "VERSION_CODE=1" > version.properties
          echo "VERSION_NAME=1.0.0" >> version.properties
          echo "VERSION_CODE=1" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.0" >> "$GITHUB_ENV"
          echo "Release Version: v1.0.0 (Code: 1)"
          cat version.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Minified & Signed Release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -x test --no-daemon --stacktrace

      - name: Prepare Output APK (Masarik-Tourism.apk)
        run: |
          mkdir -p app/build/outputs/apk/release gh-pages-apk
          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 3 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          if [ "$APK_FILE" != "app/build/outputs/apk/release/Masarik-Tourism.apk" ]; then
            cp "$APK_FILE" app/build/outputs/apk/release/Masarik-Tourism.apk
          fi
          cp app/build/outputs/apk/release/Masarik-Tourism.apk gh-pages-apk/Masarik-Tourism.apk
          ls -lh app/build/outputs/apk/release/Masarik-Tourism.apk gh-pages-apk/Masarik-Tourism.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masarik-Tourism-APK
          path: app/build/outputs/apk/release/Masarik-Tourism.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Signed APK to GitHub Pages CDN (/downloads/Masarik-Tourism.apk)
        uses: JamesIves/github-pages-deploy-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          branch: gh-pages
          folder: gh-pages-apk
          target-folder: downloads
          clean: true

      - name: Purge & Pre-warm Global Multi-CDN Cache (jsDelivr / Cloudflare)
        if: github.ref == 'refs/heads/main'
        run: |
          sleep 3
          curl -fsSL "https://purge.jsdelivr.net/gh/masarik-tourism/masarik.tourism@gh-pages/downloads/Masarik-Tourism.apk" || true
          GH_PAGES_SHA=$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')
          if [ -n "$GH_PAGES_SHA" ]; then
            echo "Pre-warming immutable jsDelivr URL for gh-pages commit: $GH_PAGES_SHA"
            curl -fsSL -o /dev/null "https://cdn.jsdelivr.net/gh/masarik-tourism/masarik.tourism@${GH_PAGES_SHA}/downloads/Masarik-Tourism.apk" || true
          fi

      - name: Publish Signed APK to GitHub Releases (v1.0.0)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0"
          name: "مسارك للإنجاز السياحي v1.0.0"
          body: |
            الإصدار الرسمي الأول من تطبيق **مسارك للإنجاز السياحي** (`v1.0.0` - Build `1`).
            - تقليص حجم التطبيق عبر R8 + shrinkResources لسرعة تحميل فائقة.
            - دعم مباشر لجسر `AndroidBridge` لفتح رابط التحميل فوراً من داخل التطبيق.
            - استضافة مباشرة على شبكة Multi-CDN عبر jsDelivr (Cloudflare + Fastly) للتحميل السريع.
          draft: false
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/release/Masarik-Tourism.apk
