name: Build & Release Signed Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_OPTS: "-Xmx3584m"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx3584m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8\""

jobs:
  build-apk:
    name: Build & Publish Masarik-Tourism.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Fixed Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Restoring fixed Release Keystore from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > release.keystore
          elif [ -f "release.keystore.base64" ]; then
            echo "Restoring permanent release.keystore.base64 from repository..."
            tr -d '\n\r ' < release.keystore.base64 | base64 -d > release.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using repository debug.keystore.base64..."
            tr -d '\n\r ' < debug.keystore.base64 | base64 -d > release.keystore
          else
            echo "ERROR: No fixed signing keystore found in Secrets or repository!"
            exit 1
          fi
          cp release.keystore debug.keystore
          ls -lh release.keystore

      - name: Set Official Release Version 1.0.1
        run: |
          echo "VERSION_CODE=2" > version.properties
          echo "VERSION_NAME=1.0.1" >> version.properties
          echo "VERSION_CODE=2" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.1" >> "$GITHUB_ENV"
          echo "Release Version: v1.0.1 (Code: 2)"
          cat version.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Minified & Signed Release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -x test --no-daemon --stacktrace

      - name: Prepare Output APK (Masarik-Tourism.apk)
        run: |
          mkdir -p app/build/outputs/apk/release
          mkdir -p gh-pages-apk
          cd app/build/outputs/apk/release
          if [ ! -f "Masarik-Tourism.apk" ]; then
            APK_FILE=$(find . -maxdepth 2 -name "*.apk" | head -n 1)
            if [ -n "$APK_FILE" ]; then
              cp "$APK_FILE" ./Masarik-Tourism.apk
            else
              echo "Error: No APK file generated!"
              exit 1
            fi
          fi
          ls -lh Masarik-Tourism.apk
          cp Masarik-Tourism.apk ../../../../gh-pages-apk/Masarik-Tourism.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masarik-Tourism-APK
          path: app/build/outputs/apk/release/Masarik-Tourism.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Signed APK to GitHub Pages CDN (/downloads/Masarik-Tourism.apk)
        uses: JamesIves/github-pages-deploy-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          branch: gh-pages
          folder: gh-pages-apk
          target-folder: downloads
          clean: true

      - name: Publish Signed APK to GitHub Releases (v1.0.1)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.1"
          name: "مسارك للإنجاز السياحي v1.0.1"
          body: |
            الإصدار الرسمي المحدّث من تطبيق **مسارك للإنجاز السياحي** (`v1.0.1` - Build `2`).
            - تقليص حجم التطبيق عبر R8 + shrinkResources لسرعة تحميل فائقة.
            - دعم مباشر لجسر `AndroidBridge` لفتح رابط التحميل فوراً من داخل التطبيق.
            - استضافة مباشرة على شبكة GitHub Pages Fastly CDN عبر `/downloads/Masarik-Tourism.apk`.
          draft: false
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/release/Masarik-Tourism.apk
