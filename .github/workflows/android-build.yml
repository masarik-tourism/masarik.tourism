name: Android Build & Sign APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_OPTS: "-Xmx3584m"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx3584m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8\""

jobs:
  build:
    name: Build Official Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Permanent Keystore for Consistent Signing
        env:
          CUSTOM_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "Setting up fixed Keystore..."
          if [ -n "$CUSTOM_KEYSTORE_B64" ]; then
            echo "Using custom Release Keystore from GitHub Secrets..."
            echo "$CUSTOM_KEYSTORE_B64" | base64 -d > release.keystore
          elif [ -f "release.keystore.base64" ]; then
            echo "Using permanent release.keystore.base64 from repository..."
            base64 -d release.keystore.base64 > release.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using fallback debug.keystore.base64..."
            base64 -d debug.keystore.base64 > release.keystore
          fi

          if [ ! -f "release.keystore" ]; then
            echo "Generating fallback keystore..."
            keytool -genkey -v -keystore release.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Masarik, OU=Tourism, O=Masarik, L=Cairo, S=Cairo, C=EG"
          fi

          cp release.keystore debug.keystore
          ls -la *.keystore

      - name: Auto-increment Version Code based on CI Run
        run: |
          CALC_CODE=$((34 + ${GITHUB_RUN_NUMBER:-1}))
          echo "VERSION_CODE=$CALC_CODE" > version.properties
          echo "VERSION_NAME=3.3.4" >> version.properties
          echo "Automated Versioning: VERSION_CODE=$CALC_CODE, VERSION_NAME=3.3.4"
          cat version.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Official Signed Release APK Only
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Guarantee Output APK is Named Masarik-Tourism.apk
        run: |
          mkdir -p app/build/outputs/apk/release
          cd app/build/outputs/apk/release
          echo "Listing generated APK files in release folder:"
          ls -la
          APK_FILE=$(find . -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" ./Masarik-Tourism.apk
            echo "Successfully generated Masarik-Tourism.apk from $APK_FILE"
          else
            echo "Error: No APK file generated!"
            exit 1
          fi
          ls -lh Masarik-Tourism.apk

      - name: Upload Official Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masarik-Tourism-APK
          path: app/build/outputs/apk/release/Masarik-Tourism.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Official APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "v3.3.4"
          name: "Masarik Tourism v3.3.4"
          body: "Official Release build of Masarik Tourism Android App (Masarik-Tourism.apk)"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/Masarik-Tourism.apk
