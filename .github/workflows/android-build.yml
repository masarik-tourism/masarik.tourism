name: Android Build & Sign APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_OPTS: "-Xmx3584m"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx3584m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8\""

jobs:
  build:
    name: Build Official Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Permanent Keystore for Consistent Signing
        env:
          CUSTOM_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "Setting up fixed Keystore..."
          if [ -n "$CUSTOM_KEYSTORE_B64" ]; then
            echo "Using custom Release Keystore from GitHub Secrets..."
            echo "$CUSTOM_KEYSTORE_B64" | base64 -d > release.keystore
          elif [ -f "release.keystore.base64" ]; then
            echo "Using permanent release.keystore.base64 from repository..."
            base64 -d release.keystore.base64 > release.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using fallback debug.keystore.base64..."
            base64 -d debug.keystore.base64 > release.keystore
          fi

          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -f "release.keystore" ]; then
            cp release.keystore debug.keystore
          fi

          ls -la *.keystore

      - name: Auto-increment Version Code in version.properties
        run: |
          if [ -f "version.properties" ]; then
            OLD_CODE=$(grep 'VERSION_CODE=' version.properties | cut -d'=' -f2)
            NEW_CODE=$((OLD_CODE + 1))
            sed -i "s/VERSION_CODE=.*/VERSION_CODE=$NEW_CODE/" version.properties
            echo "Auto-incremented VERSION_CODE: $OLD_CODE -> $NEW_CODE"
          else
            echo "VERSION_CODE=35" > version.properties
            echo "VERSION_NAME=3.3.4" >> version.properties
            echo "Initialized version.properties with VERSION_CODE=35"
          fi
          cat version.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Official Signed Release APK Only
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Guarantee Output APK is Named Masarik-Tourism.apk
        run: |
          mkdir -p app/build/outputs/apk/release
          cd app/build/outputs/apk/release
          echo "Listing generated APK files in release folder:"
          ls -la
          # If output is not already named Masarik-Tourism.apk, copy generated release apk to it
          FIRST_APK=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -n "$FIRST_APK" ] && [ "$FIRST_APK" != "Masarik-Tourism.apk" ]; then
            cp "$FIRST_APK" Masarik-Tourism.apk
            echo "Successfully guaranteed Masarik-Tourism.apk from $FIRST_APK"
          fi
          ls -la Masarik-Tourism.apk

      - name: Upload Official Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Masarik-Tourism-APK
          path: app/build/outputs/apk/release/Masarik-Tourism.apk
          if-no-files-found: error
          retention-days: 30
